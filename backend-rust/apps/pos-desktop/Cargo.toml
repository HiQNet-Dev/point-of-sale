[package]
name = "pos-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
build = "build.rs"

# La dependencia gráfica queda fuera del workspace headless de producto.
[workspace]

[dependencies]
pos-core = { path = "../../crates/pos-core" }
pos-application = { path = "../../crates/pos-application" }
pos-credentials = { path = "../../crates/pos-credentials" }
pos-storage-sqlite = { path = "../../crates/pos-storage-sqlite" }
pos-lab = { path = "../../tools/pos-lab" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite"] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["sync"] }
tauri = { version = "=2.12.5", features = ["test"] }
specta = { version = "=2.0.0-rc.26", features = ["derive", "function"] }
tauri-specta = { version = "=2.0.0-rc.26", features = ["typescript"] }
specta-typescript = "=0.0.13"

[build-dependencies]
tauri-build = "=2.7.4"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
