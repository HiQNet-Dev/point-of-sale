# Disposable end-to-end environment only. The E2E launcher validates that this
# URL points at a local database named hiqnet_pos_e2e before starting services.
spring:
  datasource:
    url: ${E2E_DB_URL}
    username: ${E2E_DB_USER}
    password: ${E2E_DB_PASSWORD}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://127.0.0.1:5173}
  security:
    permit-opendoc: false
