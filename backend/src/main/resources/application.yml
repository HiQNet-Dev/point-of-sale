# Common configuration for all environments.
# Secrets and environment-specific values live in profile-specific files
# and are resolved from environment variables. No real secrets in Git.
spring:
  application:
    name: hiqnet-pos
    # Versión de la aplicación, inyectada por el filtrado de recursos de Maven
    # desde backend/pom.xml. La expone OpenAPI (springdoc) como versión de la
    # API; no fija reglas de negocio.
    version: "@project.version@"
  profiles:
    # Local runs without an explicit profile get the development defaults.
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      # Flyway is the only mechanism allowed to change the schema.
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      # Do not leak component details (DB host, disk paths, etc.).
      show-details: never

app:
  cors:
    # Comma-separated allowlist. Empty means "no cross-origin access".
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  auth:
    # JWT secret: REQUIRED, no default. Generate with:
    #   openssl rand -base64 32
    # An empty/missing value fails startup (fail fast). Tests provide their
    # own secret in src/test/resources/application-test.yml.
    jwt-secret: ${AUTH_JWT_SECRET:}
    issuer: hiqnet-pos
    audience: hiqnet-pos-api
    access-token-ttl: 10m
    refresh-token-ttl: 30d
    family-ttl: 30d
    max-failed-attempts: 5
    lockout-duration: 15m
    # BCrypt work factor. 12 is the documented production value; the test
    # profile lowers it to 10 purely to keep the suite fast.
    password-strength: 12

  security:
    permit-opendoc: false
  bootstrap:
    # One-shot deployment secret for the first-run provisioning (POST
    # /api/v1/bootstrap). OPTIONAL: when empty/absent the bootstrap route is
    # CLOSED (deny-by-default). When set it must be Base64 decoding to >= 32
    # bytes (`openssl rand -base64 32`) or startup fails. DISTINCT from
    # AUTH_JWT_SECRET; remove it after provisioning and restart.
    secret: ${BOOTSTRAP_SECRET:}
