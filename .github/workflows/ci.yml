name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      target_sha:
        description: Full 40-character commit SHA in this repository
        required: true
        type: string

permissions:
  contents: read

# Cancela runs obsoletos cuando llega un commit nuevo al mismo PR o a la misma
# rama/evento, sin cancelar entre sí runs independientes (main o dispatch).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Decide qué jobs hacen falta según las áreas modificadas.
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      backend_run: ${{ steps.detect.outputs.backend_run }}
      rust_run: ${{ steps.detect.outputs.rust_run }}
      frontend_run: ${{ steps.detect.outputs.frontend_run }}
      compose_run: ${{ steps.detect.outputs.compose_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Test CI change detection and gates
        run: python3 .github/scripts/test_ci_changes.py

      - name: Detect changed areas
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: bash .github/scripts/ci-changes.sh

  backend:
    name: Backend (compile, test, package)
    needs: changes
    if: needs.changes.outputs.backend_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate requested SHA input
        env:
          TARGET_SHA: ${{ inputs.target_sha || github.sha }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Manual validation must be dispatched from main" >&2
            exit 1
          fi
          if [[ ! "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "target_sha must be a full lowercase 40-character commit SHA" >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha || github.sha }}
          persist-credentials: false

      - name: Verify checked-out target
        env:
          TARGET_SHA: ${{ inputs.target_sha || github.sha }}
        run: |
          git cat-file -e "${TARGET_SHA}^{commit}"
          CHECKED_OUT_SHA="$(git rev-parse HEAD)"
          echo "TARGET_SHA=${TARGET_SHA}"
          echo "CHECKED_OUT_SHA=${CHECKED_OUT_SHA}"
          echo "VERSION=$(cat VERSION)"
          [[ "$CHECKED_OUT_SHA" == "$TARGET_SHA" ]]

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build with Maven Wrapper
        run: ./mvnw -B -ntp clean verify
        working-directory: backend

  # Nivel 1: integración técnica. Obligatorio para cada PR y push que toque
  # Rust. No evalúa la completitud normativa: ese control vive en
  # `rust-normative`. Un fallo real aquí siempre rompe el gate.
  rust:
    name: Rust Technical Integration Gate
    needs: changes
    if: needs.changes.outputs.rust_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend-rust
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Validate requested SHA input
        working-directory: .
        env:
          TARGET_SHA: ${{ inputs.target_sha || github.sha }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Manual validation must be dispatched from main" >&2
            exit 1
          fi
          if [[ ! "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "target_sha must be a full lowercase 40-character commit SHA" >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha || github.sha }}
          persist-credentials: false

      - name: Verify checked-out target and committed lockfile
        env:
          TARGET_SHA: ${{ inputs.target_sha || github.sha }}
        run: |
          [[ "$(git rev-parse HEAD)" == "$TARGET_SHA" ]]
          git ls-files --error-unmatch Cargo.lock
          test -f Cargo.lock

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Install verified secret scanner
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks

      - name: Scan Rust sources for secrets
        run: '"$RUNNER_TEMP/gitleaks" dir . --redact --no-banner'

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
          rustup override set 1.99.1
          rustc --version
          cargo --version

      - name: Test evidence verifier integrity checks
        run: python3 -B tools/migration-lab/scripts/test_verify_evidence.py

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Clippy (all targets and features)
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Test Rust workspace
        run: cargo test --locked --workspace --all-features

      - name: Build Rust workspace
        run: cargo build --locked --workspace --all-features

      # PostgreSQL 17.11 se compila desde fuente oficial con SHA-256 fijado.
      # No se usa el socket Docker ni un servidor PostgreSQL del sistema.
      - name: Build pinned PostgreSQL 17 for the native lab
        run: sh tools/migration-lab/scripts/build_postgres.sh

      # Exit 0 means technical execution, NOT normative migration approval.
      # The mandatory normative gate below blocks incomplete schema/DDL13.
      - name: Generate technical and native migration evidence (not normative approval)
        run: cargo run --locked -p migration-lab -- --output target/migration-evidence --postgres-bin target/pg17-build/install/bin --java-source

      - name: Verify technical evidence and blocked normative gate
        run: python3 tools/migration-lab/scripts/verify_evidence.py --evidence target/migration-evidence --expect-exit 0

      - name: Install pinned Cargo audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Audit committed Cargo lockfile
        run: cargo audit --file Cargo.lock --json > target/cargo-audit.json

      - name: Upload technical evidence and dependency audit
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rust-technical-evidence
          path: |
            backend-rust/target/migration-evidence
            backend-rust/target/cargo-audit.json
          if-no-files-found: warn
          retention-days: 7

  # Nivel 2: verificación normativa real. No condiciona la integración técnica a
  # `dev`, pero `main` y cualquier release exigen PASSED. El estado se publica
  # tal como lo reporta el laboratorio: PASSED, BLOCKED o FAILED.
  rust-normative:
    name: Rust Normative Release Gate
    needs: [changes, rust]
    if: >-
      always() && (
        needs.changes.outputs.rust_run == 'true' ||
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'pull_request' && github.base_ref == 'main')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: backend-rust
    env:
      CARGO_TERM_COLOR: always
    outputs:
      status: ${{ steps.gate.outputs.status }}
      exit_code: ${{ steps.gate.outputs.exit_code }}
    steps:
      - name: Validate requested SHA input
        working-directory: .
        env:
          TARGET_SHA: ${{ inputs.target_sha || github.sha }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Manual validation must be dispatched from main" >&2
            exit 1
          fi
          if [[ ! "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "target_sha must be a full lowercase 40-character commit SHA" >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha || github.sha }}
          persist-credentials: false

      - name: Verify checked-out target and committed lockfile
        env:
          TARGET_SHA: ${{ inputs.target_sha || github.sha }}
        run: |
          [[ "$(git rev-parse HEAD)" == "$TARGET_SHA" ]]
          git ls-files --error-unmatch Cargo.lock
          test -f Cargo.lock

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
          rustup override set 1.99.1
          rustc --version
          cargo --version

      # PostgreSQL 17.11 se compila desde fuente oficial con SHA-256 fijado.
      - name: Build pinned PostgreSQL 17 for the native lab
        run: sh tools/migration-lab/scripts/build_postgres.sh

      # El wrapper clasifica el exit del laboratorio sin ocultarlo: 0 PASSED,
      # 2 BLOCKED, cualquier otro FAILED (que sí rompe el paso).
      - name: Run the normative migration gate and classify its exit code
        id: gate
        run: bash ../.github/scripts/rust-normative-gate.sh

      - name: Verify published normative evidence
        run: python3 tools/migration-lab/scripts/verify_evidence.py --evidence target/migration-gate-evidence --expect-exit "${{ steps.gate.outputs.exit_code }}"

      - name: Upload normative evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rust-normative-evidence
          path: |
            backend-rust/target/migration-gate-evidence
          if-no-files-found: warn
          retention-days: 7

  # Nivel 1 en Windows: verificabilidad real del runtime Tauri (compilación,
  # pruebas del registro IPC y build del binario). No genera instalador ni
  # bundle comercial. `pos-desktop` tiene workspace propio, por eso no lo cubre
  # el job `rust`.
  windows-desktop:
    name: Windows Desktop (Tauri)
    needs: changes
    if: needs.changes.outputs.rust_run == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: backend-rust/apps/pos-desktop
    env:
      CARGO_TERM_COLOR: always
      RUSTUP_TOOLCHAIN: "1.99.1"
    steps:
      - name: Validate requested SHA input
        working-directory: .
        env:
          TARGET_SHA: ${{ inputs.target_sha || github.sha }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Manual validation must be dispatched from main" >&2
            exit 1
          fi
          if [[ ! "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "target_sha must be a full lowercase 40-character commit SHA" >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha || github.sha }}
          persist-credentials: false

      - name: Verify checked-out target and committed lockfile
        env:
          TARGET_SHA: ${{ inputs.target_sha || github.sha }}
        run: |
          [[ "$(git rev-parse HEAD)" == "$TARGET_SHA" ]]
          git ls-files --error-unmatch Cargo.lock

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
          rustc --version
          cargo --version

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      # `generate_context!` exige que exista `frontend/dist-rust-lab`; sin este
      # paso la compilación del desktop falla.
      - name: Build the synthetic frontend required by the Tauri context
        working-directory: frontend
        run: pnpm exec vite build --config vite.rust-lab.config.ts

      - name: Resolve the committed lockfile
        run: cargo metadata --locked --format-version 1 > /dev/null

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (all targets)
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test the desktop runtime and IPC registry
        run: cargo test --locked

      - name: Build the desktop binary (bundling stays disabled)
        run: cargo build --locked

  frontend:
    name: Frontend (install, lint, typecheck, test, build)
    needs: changes
    if: needs.changes.outputs.frontend_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate requested SHA input
        env:
          TARGET_SHA: ${{ inputs.target_sha || github.sha }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Manual validation must be dispatched from main" >&2
            exit 1
          fi
          if [[ ! "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "target_sha must be a full lowercase 40-character commit SHA" >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha || github.sha }}
          persist-credentials: false

      - name: Verify checked-out target
        env:
          TARGET_SHA: ${{ inputs.target_sha || github.sha }}
        run: |
          git cat-file -e "${TARGET_SHA}^{commit}"
          CHECKED_OUT_SHA="$(git rev-parse HEAD)"
          echo "TARGET_SHA=${TARGET_SHA}"
          echo "CHECKED_OUT_SHA=${CHECKED_OUT_SHA}"
          echo "VERSION=$(cat VERSION)"
          [[ "$CHECKED_OUT_SHA" == "$TARGET_SHA" ]]

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Lint
        run: pnpm lint
        working-directory: frontend

      - name: Typecheck
        run: pnpm typecheck
        working-directory: frontend

      - name: Test
        run: pnpm test
        working-directory: frontend

      - name: Build
        run: pnpm build
        working-directory: frontend

  compose:
    name: Validate docker-compose
    needs: changes
    if: needs.changes.outputs.compose_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate requested SHA input
        env:
          TARGET_SHA: ${{ inputs.target_sha || github.sha }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Manual validation must be dispatched from main" >&2
            exit 1
          fi
          if [[ ! "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "target_sha must be a full lowercase 40-character commit SHA" >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha || github.sha }}
          persist-credentials: false

      - name: Verify checked-out target
        env:
          TARGET_SHA: ${{ inputs.target_sha || github.sha }}
        run: |
          git cat-file -e "${TARGET_SHA}^{commit}"
          CHECKED_OUT_SHA="$(git rev-parse HEAD)"
          echo "TARGET_SHA=${TARGET_SHA}"
          echo "CHECKED_OUT_SHA=${CHECKED_OUT_SHA}"
          echo "VERSION=$(cat VERSION)"
          [[ "$CHECKED_OUT_SHA" == "$TARGET_SHA" ]]

      - name: Validate compose file
        run: docker compose config

  # Integración E2E real: push a `main`, PR hacia `main` y validación manual.
  # El CI de PRs hacia `dev` no la ejecuta; `CI Gate` la exige solo cuando el
  # destino es `main` o la ejecución es manual.
  e2e:
    name: POS integrated E2E (Chromium + PostgreSQL)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.base_ref == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: hiqnet_pos_e2e
          POSTGRES_USER: e2e_user
          POSTGRES_PASSWORD: e2e_local_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U e2e_user -d hiqnet_pos_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      APP_ENV: e2e
      SPRING_PROFILES_ACTIVE: e2e
      E2E_DB_URL: jdbc:postgresql://127.0.0.1:5432/hiqnet_pos_e2e
      E2E_DB_USER: e2e_user
      E2E_DB_PASSWORD: e2e_local_only
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:5173
      E2E_API_URL: http://127.0.0.1:8080/api/v1
      E2E_FRONTEND_URL: http://127.0.0.1:5173
      VITE_API_BASE_URL: http://127.0.0.1:8080/api/v1
      E2E_ORGANIZATION_CODE: pos-e2e
      E2E_ADMIN_EMAIL: admin@pos-e2e.invalid
      E2E_CASHIER_EMAIL: cashier@pos-e2e.invalid
      PLAYWRIGHT_ARTIFACT_DIR: /tmp/hiqnet-pos-playwright
    steps:
      - name: Validate requested SHA input
        env:
          TARGET_SHA: ${{ inputs.target_sha || github.sha }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Manual validation must be dispatched from main" >&2
            exit 1
          fi
          if [[ ! "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "target_sha must be a full lowercase 40-character commit SHA" >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha || github.sha }}
          persist-credentials: false

      - name: Verify checked-out target
        env:
          TARGET_SHA: ${{ inputs.target_sha || github.sha }}
        run: |
          git cat-file -e "${TARGET_SHA}^{commit}"
          CHECKED_OUT_SHA="$(git rev-parse HEAD)"
          echo "TARGET_SHA=${TARGET_SHA}"
          echo "CHECKED_OUT_SHA=${CHECKED_OUT_SHA}"
          echo "VERSION=$(cat VERSION)"
          [[ "$CHECKED_OUT_SHA" == "$TARGET_SHA" ]]

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Generate and mask disposable test-only secrets
        run: |
          node -e 'const c=require("node:crypto"); const fs=require("node:fs"); const values={BOOTSTRAP_SECRET:c.randomBytes(32).toString("base64"),AUTH_JWT_SECRET:c.randomBytes(32).toString("base64"),E2E_ADMIN_PASSWORD:c.randomBytes(24).toString("base64url"),E2E_CASHIER_PASSWORD:c.randomBytes(24).toString("base64url")}; for (const [key,value] of Object.entries(values)) { console.log(`::add-mask::${value}`); fs.appendFileSync(process.env.GITHUB_ENV, `${key}=${value}` + String.fromCharCode(10)); }'

      - name: Validate E2E database safety guard
        run: node scripts/e2e/safety-check.mjs
        working-directory: frontend

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
        working-directory: frontend

      - name: Start Spring Boot against disposable PostgreSQL
        run: ./mvnw -B -ntp spring-boot:run > /tmp/hiqnet-pos-backend.log 2>&1 &
        working-directory: backend

      - name: Wait for backend health
        run: |
          for attempt in $(seq 1 120); do
            if curl --fail --silent http://127.0.0.1:8080/actuator/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/hiqnet-pos-backend.log
          exit 1

      - name: Start Vite frontend
        run: pnpm dev --host 127.0.0.1 --port 5173 > /tmp/hiqnet-pos-frontend.log 2>&1 &
        working-directory: frontend

      - name: Wait for frontend HTTP
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:5173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/hiqnet-pos-frontend.log
          exit 1

      - name: Typecheck E2E harness
        run: pnpm typecheck:e2e
        working-directory: frontend

      - name: Run real-browser E2E journey
        run: pnpm e2e
        working-directory: frontend

      - name: Assert persisted Sale, Payment, snapshots, and audit events
        env:
          PGPASSWORD: e2e_local_only
        run: psql "postgresql://e2e_user@127.0.0.1:5432/hiqnet_pos_e2e" -v org_code=pos-e2e -f frontend/scripts/e2e/assert-db.sql

      - name: Attach server diagnostics on failure
        if: failure()
        run: |
          mkdir -p /tmp/hiqnet-pos-playwright/results/server-logs
          cp /tmp/hiqnet-pos-backend.log /tmp/hiqnet-pos-playwright/results/server-logs/backend.log || true
          cp /tmp/hiqnet-pos-frontend.log /tmp/hiqnet-pos-playwright/results/server-logs/frontend.log || true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: pos-e2e-failure-artifacts
          path: |
            /tmp/hiqnet-pos-playwright/results
            /tmp/hiqnet-pos-playwright/report
          if-no-files-found: ignore
          retention-days: 7

  # Gate estable: único required status check recomendado. Aplica la política
  # del destino: `dev` exige los controles técnicos, una observación normativa
  # correcta (PASSED, o BLOCKED declarado) y tolera E2E omitido; `main` exige
  # además PASSED y E2E en `success` (un `skipped` nunca satisface el E2E).
  ci-gate:
    name: CI Gate
    if: always()
    needs: [changes, backend, rust, rust-normative, windows-desktop, frontend, compose, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify required jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          REF: ${{ github.ref }}
        run: |
          echo "$NEEDS"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            destination="$BASE_REF"
          elif [[ "$EVENT_NAME" == "push" ]]; then
            destination="${REF#refs/heads/}"
          else
            destination="main"
          fi
          echo "destination=$destination"
          main=false
          if [[ "$destination" == "main" ]]; then main=true; fi
          echo "$NEEDS" | jq -e --argjson main "$main" '
            def ok: .result == "success" or .result == "skipped";
            . as $n
            | ($n.changes.result == "success")
            and (($n.changes.outputs.rust_run == "true") or ($n.changes.outputs.rust_run == "false"))
            and (
              if $n.changes.outputs.rust_run == "true" then
                ($n.rust.result == "success")
                and ($n["windows-desktop"].result == "success")
                and ($n["rust-normative"].result == "success")
                and (
                  ($n["rust-normative"].outputs.status == "PASSED")
                  or (($n["rust-normative"].outputs.status == "BLOCKED") and ($main | not))
                )
              else
                ($n.rust | ok)
                and ($n["windows-desktop"] | ok)
                and ($n["rust-normative"] | ok)
                and (($main | not) or ($n["rust-normative"].outputs.status == "PASSED"))
              end
            )
            and (["backend", "frontend", "compose"] | all(.[]; ($n[.] | ok)))
            and (
              ($n.e2e.result == "success")
              or (($main | not) and ($n.e2e.result == "skipped"))
            )
          '
